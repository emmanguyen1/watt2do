const IC={cam:`<svg width="44" height="44" viewBox="0 0 24 24" ${ST}><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`,pin:`<svg width="44" height="44" viewBox="0 0 24 24" ${ST}><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,gps:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>`,home:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M4 11l8-7 8 7v9H4z"/></svg>`,bolt:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>`,usr:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,sun:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>`,moon:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg>`,star:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/></svg>`};
const R=[{item:'AA battery',cat:'battery',type:'Alkaline',dam:'',conf:.95,f:'batteries',st:['Tape the terminals if you are storing several.','Keep it out of household trash and curbside recycling.','Take it to a battery drop-off point.']},
{item:'Phone battery',cat:'battery',type:'Lithium-ion',dam:'Swollen cell: fire risk. Keep it away from heat.',conf:.9,f:'batteries',st:['Tape over the terminals.','Store it in a non-flammable container, away from heat and flammable items.','Never put it in household trash.','Take it to a drop-off point soon.']},
{item:'Coin',cat:'other',type:'',dam:'',conf:.9,f:'none',st:['This is not a battery.','It can go in the regular bin.']},

let D=[[28.0587,-82.4139,['batteries','ewaste'],1],[28.0711,-82.4302,['batteries','hazardous'],1],[28.0436,-82.3991,['ewaste'],0],[28.0902,-82.4545,['batteries','ewaste','hazardous'],1],[28.0214,-82.4417,['hazardous'],0],[28.0793,-82.3724,['batteries'],1],[28.0522,-82.4798,['ewaste','batteries'],0]].map((d,i)=>({id:'s'+i,name:'Sample drop-off '+(i+1),lat:d[0],lng:d[1],acc:d[2],open:!!d[3]}));

<div class="sw">${r.f!=='none'?`<button class="cta" data-a="find" data-v="${r.f}">Find drop-off near me</button>`:'<p class="m">This can go in the regular bin.</p>'}<button class="ch" data-a="scan">Scan another</button></div>`},
find(){const F=M.F,c=F.u||{lat:28.06,lng:-82.41};let L=D.filter(d=>(F.f==='all'||d.acc.includes(F.f))&&(!F.open||d.open)).map(d=>({...d,km:hv(c.lat,c.lng,d.lat,d.lng)})).sort((a,b)=>a.km-b.km).slice(0,10);
const mx=Math.max(1,...L.map(d=>d.km)),k=110/mx,P=d=>[200+(d.lng-c.lng)*Math.cos(c.lat*Math.PI/180)*111*k,130-(d.lat-c.lat)*111*k];
const pins=L.map((d,i)=>{const[x,y]=P(d),s=F.sel===d.id;return `<circle cx="${x}" cy="${y}" r="${s?17:13}" fill="var(--ac)" stroke="var(--ol)" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1410">${i+1}</text>`}).join('');
return `<h2>Nearby drop-offs</h2><div class="cd row" style="margin:8px 0 12px">${IC.gps}<span style="flex:1">${F.u?'GPS on: using your location':'Showing the Tampa (USF) area'}</span><button class="ch sm" data-a="locate">${F.u?'Update':'Use my location'}</button></div>${F.msg?`<p class="m sm" role="status">${F.msg}</p>`:''}

<p class="m sm" style="margin:6px 0 12px">Local drop-offs around USF & Hillsborough County.</p>
${L.length?L.map((d,i)=>`<div class="cd row" style="margin-bottom:10px;${F.sel===d.id?'border-color:var(--ol)':''}"><span class="n">${i+1}</span><button data-a="sel" data-v="${d.id}" style="flex:1;text-align:left;background:none;border:0;padding:4px 0"><b>${d.name}</b><div class="m sm">${d.km.toFixed(1)} km · ${d.open?'Open now':'Closed'} · ${d.acc.join(', ')}${d.address?`<br>${d.address}`:''}${d.hours?`<br>${d.hours}`:''}</div></button><button class="ib" data-a="save" data-v="${d.id}" aria-pressed="${S.saved.includes(d.id)}" aria-label="Save ${d.name}" style="${S.saved.includes(d.id)?'background:var(--ac);color:var(--ot)':''}">${IC.star}</button></div>`).join(''):'<p class="m">No drop-offs match. Try another filter.</p>'}`},
impact(){const c=S.count,l=Math.floor(c/5)+1,f=c%5;return `<div style="text-align:center;padding-top:10px"><h2>Your impact</h2><div class="big">${c}</div><p>items kept out of landfill</p><div class="seg" role="img" aria-label="Level progress">${[0,1,2,3,4].map(i=>`<i class="${i<f?'on':''}"></i>`).join('')}</div><p class="m">Level ${l} · ${5-f} more scans to Level ${l+1}</p><div class="sw" style="justify-content:center">${[[1,'First scan'],[5,'5 items'],[10,'10 items']].map(b=>`<span class="cd sm" style="${c>=b[0]?'border-color:var(--ol);font-weight:700':'opacity:.5'}">${b[1]}</span>`).join('')}</div><div style="margin-top:22px"><button class="cta" data-a="scan">Scan another item</button></div></div>`},
profile(){const u=S.user,t=['auto','light','dark'];return `<div style="text-align:center"><div style="width:92px;height:92px;border-radius:50%;border:3px solid var(--ol);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:var(--ol)"><svg width="46" height="46" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div><h2 style="margin:0">${esc(u.name)}</h2><p class="m">${u.guest?'Guest mode':esc(u.email)}</p></div>

<h2 style="font-size:20px;margin:20px 0 8px">Saved drop-off points</h2>${S.saved.length?S.saved.map(id=>`<div class="cd" style="margin-bottom:8px">${(D.find(d=>d.id===id)||{}).name}</div>`).join(''):'<p class="m">Tap the star on a drop-off to save it.</p>'}
<div class="sw">${u.guest?'<button class="cta" data-a="out">Create an account</button>':'<button class="ch" data-a="out">Sign out</button>'}<button class="ch" data-a="clear">Clear my data</button></div>`}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(v){if(location.hash==='#'+v)render();else location.hash=v}

async function scan(f){
  if(!f)return;
  M.img='';
  try{M.img=URL.createObjectURL(f)}catch(e){}
  M.load=true;
  render();
  let r=null;
  try{
    const res=await fetch('/api/scan',{
      method:'POST',
      headers:{'content-type':f.type||'image/jpeg'},
      body:f
    });
    if(res.ok){
      const data=await res.json();
      if(data.type){
        const planRes=await fetch('/api/plan',{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({type:data.type,condition:data.condition||'intact',area:'Tampa'})
        });
        if(planRes.ok){
          const pData=await planRes.json();
          const adv=pData.advice||{};
          r={
            item:adv.summary||data.description||'Battery',
            cat:'battery',
            type:data.type,
            dam:data.condition&&data.condition!=='intact'?(adv.headline||data.conditionEvidence||'Damaged condition'):'',
            conf:0.95,
            f:'batteries',
            st:adv.steps||['Tape terminals','Store safely','Take to drop-off']
          };
          if(Array.isArray(pData.sites)&&pData.sites.length){
            D=pData.sites.map((x,i)=>({
              id:'s'+i,
              name:x.name,
              lat:x.lat,
              lng:x.lng,
              acc:x.types||['batteries'],
              open:true,
              address:x.address||'',
              hours:x.hours||''
            }));
          }
        }
      }
    }
  }catch(e){}
  if(!r){
    await new Promise(res=>setTimeout(res,1200));
    r=R[M.n++%R.length];
  }
  M.cur=r;
  M.load=false;
  if(r.conf>=.6&&r.cat!=='other'){
    S.count++;
    S.hist.unshift({item:r.item,type:r.type,d:new Date().toLocaleDateString()});
    S.hist=S.hist.slice(0,20);
    sv();
  }
  go('result');
  render();
}

async function submitManual(type,condition,area){
  M.load=true;
  render();
  try{
    const body={type,condition,area};
    if(M.F.u) body.position=[M.F.u.lat,M.F.u.lng];
    const res=await fetch('/api/plan',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(body)
    });
    if(res.ok){
      const data=await res.json();
      const adv=data.advice||{};
      M.cur={
        item:adv.summary||type,
        cat:'battery',
        type:type,
        dam:condition!=='intact'?(adv.headline||adv.callout||'Damaged / emergency condition'):'',
        conf:1.0,
        f:condition==='intact'?'batteries':'none',
        st:adv.steps||adv.guidance||['Tape terminals','Store in safe container','Follow county guidelines']
      };
      if(Array.isArray(data.sites)&&data.sites.length){
        D=data.sites.map((x,i)=>({
          id:'s'+i,
          name:x.name,
          lat:x.lat,
          lng:x.lng,
          acc:x.types||['batteries'],
          open:true,
          address:x.address||'',
          hours:x.hours||''
        }));
      }
      M.load=false;
      if(condition==='intact'){
        S.count++;
        S.hist.unshift({item:M.cur.item,type:M.cur.type,d:new Date().toLocaleDateString()});
        S.hist=S.hist.slice(0,20);
        sv();
      }
      go('result');
      return;
    }
  }catch(e){}
  M.load=false;
  M.cur=R[0];
  go('result');
}

function reply(q){q=q.toLowerCase();const has=(...w)=>w.some(x=>q.includes(x));
if(has('swollen','puffy','bulg'))return['A swollen lithium battery is a fire risk. Tape the terminals, keep it away from heat and flammable items, use a non-flammable container, and take it to a drop-off point soon.',1];
if(has('trash','bin','garbage','throw'))return['Batteries should not go in household trash or curbside recycling. They can spark fires in garbage trucks and recycling plants.',1];
if(has('where','drop','near','location','take'))return['I can show drop-off points near you.',1];
if(has('tape','terminal'))return['Taping the terminals stops them touching metal and shorting. It matters most for lithium and 9V batteries.'];
if(has('lithium','phone','vape'))return['Lithium-ion batteries need extra care: tape the terminals, keep them cool, and never put them in the trash.',1];
if(has('coin','button'))return['Coin and button cells are lithium too. Tape them and take them to a drop-off point. Keep them away from children.',1];
if(has('level','impact','count'))return['Each battery you keep out of landfill adds to your count. Every 5 scans is a new level.'];
if(has('hi','hello','hey'))return['Hi! Ask me about battery safety or where to drop one off.'];
return['I can help with battery safety, disposal, and finding drop-off points. Try “Where do I take a battery?”']}
function say(q){if(!q.trim())return;M.chat.push({t:q});const r=reply(q);M.chat.push({b:1,t:r[0],a:r[1]});cr()}
function cr(){const m=$('#ms');m.innerHTML=M.chat.map(x=>`<div class="${x.b?'bw':'bu'}">${esc(x.t)}${x.a?'<div class="sw" style="margin-top:8px"><button class="ch sm" data-a="chatfind">Show drop-off points</button></div>':''}</div>`).join('');m.scrollTop=m.scrollHeight}

async function locate(){
  const F=M.F;
  if(!navigator.geolocation){
    F.msg='GPS isn’t available here, so I’m showing the Tampa area.';
    render();
    fetchBackendDropoffs(28.06,-82.41);
    return;
  }
  F.msg='Finding your location…';
  render();
  navigator.geolocation.getCurrentPosition(async p=>{
    F.u={lat:p.coords.latitude,lng:p.coords.longitude};
    F.msg='';
    render();
    await fetchBackendDropoffs(p.coords.latitude,p.coords.longitude);
  },async ()=>{
    F.u=null;
    F.msg='Couldn’t get your location, so I’m showing the Tampa area.';
    render();
    await fetchBackendDropoffs(28.06,-82.41);
  },{timeout:8000});
}

async function fetchBackendDropoffs(lat,lng){
  try{
    const filter=M.F.f==='all'?'batteries':M.F.f;
    const res=await fetch(`/api/dropoffs?lat=${lat}&lng=${lng}&filter=${filter}`);
    if(res.ok){
      const data=await res.json();
      if(data.ok&&Array.isArray(data.results)&&data.results.length){
        D=data.results.map((x,i)=>({
          id:x.id||'s'+i,
          name:x.name||('Drop-off '+(i+1)),
          lat:x.lat,
          lng:x.lng,
          acc:x.accepts||['batteries'],
          open:x.openNow!==false,
          address:x.address||'',
          hours:x.hours||''
        }));
        render();
      }
    }
  }catch(e){}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,F=M.F;
if(a==='tab'){M.tab=v;M.err='';render()}
else if(a==='guest'){S.user={name:'Guest',guest:1};sv();go('home')}
else if(a==='scan')$('#fi').click();
else if(a==='go')go(v);
else if(a==='find'){F.f=v;go('find');fetchBackendDropoffs(F.u?F.u.lat:28.06,F.u?F.u.lng:-82.41)}
else if(a==='theme'){S.theme=eff()==='dark'?'light':'dark';sv();render()}
else if(a==='th'){S.theme=v;sv();render()}
else if(a==='locate')locate();
else if(a==='open'){F.open=!F.open;render()}
else if(a==='flt'){F.f=v;render();fetchBackendDropoffs(F.u?F.u.lat:28.06,F.u?F.u.lng:-82.41)}
else if(a==='sel'){F.sel=F.sel===v?null:v;render()}
else if(a==='save'){const i=S.saved.indexOf(v);i<0?S.saved.push(v):S.saved.splice(i,1);sv();render()}
else if(a==='out'){S.user=null;M.tab=a==='out'?'create':'in';sv();go('welcome');render()}
else if(a==='clear'){S={user:S.user,acc:S.acc,count:0,hist:[],saved:[],theme:S.theme};sv();render()}
else if(a==='fab'){const c=$('#chat');c.hidden=!c.hidden;if(!c.hidden){cr();$('#ci').focus()}}
else if(a==='q')say(b.dataset.q);
else if(a==='chatfind'){$('#chat').hidden=true;go('find')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='cf'){const i=$('#ci');say(i.value);i.value='';return}
if(e.target.id==='mf'){const t=$('#m-type').value,c=$('#m-cond').value,a=$('#m-area').value.trim()||'Tampa';submitManual(t,c,a);return}
if(e.target.id==='af'){const f=new FormData(e.target),em=f.get('e').trim().toLowerCase(),pw=btoa(f.get('p'));M.err='';
if(M.tab==='create'){if(S.acc.some(x=>x.e===em)){M.err='That email already has an account. Try Sign in.';render();return}const n=f.get('n').trim();S.acc.push({e:em,n,p:pw});S.user={name:n,email:em}}
else{const a=S.acc.find(x=>x.e===em&&x.p===pw);if(!a){M.err='No account matches that email and password.';render();return}S.user={name:a.n,email:em}}
sv();go('home');render()}});
$('#fi').addEventListener('change',e=>{scan(e.target.files[0]);e.target.value=''});
addEventListener('hashchange',render);
$('#logo').innerHTML=BAT(30)+'<span>Watt<b>2</b>Do</span>';$('#fab').innerHTML=MS(38);$('#cav').innerHTML=MS(32);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
render();
</script>
