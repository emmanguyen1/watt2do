<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watt2Do — Watt's Next? Watt2Do.</title>
<meta name="description" content="AI battery identification, safety damage detection, and drop-off locator.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F5EE;--tx:#0E1410;--mu:#4A5547;--cd:#FFFFFF;--bd:#C4CEB8;--ac:#C6F432;--ot:#0E1410;--ol:#4F6F00;--tr:#DCE3D2;--rd:#C62828;--rb:#FDECEA;--rt:#7A1C14;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1410;--tx:#F2F5EE;--mu:#A3AE9E;--cd:#18201A;--bd:#3A4A3C;--ol:#C6F432;--tr:#2A352C;--rd:#FF5A4F;--rb:#3A1512;--rt:#FFD2CE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1410;--tx:#F2F5EE;--mu:#A3AE9E;--cd:#18201A;--bd:#3A4A3C;--ol:#C6F432;--tr:#2A352C;--rd:#FF5A4F;--rb:#3A1512;--rt:#FFD2CE;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Space Grotesk',system-ui,sans-serif;min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:980px;margin:0 auto}
.lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--tx);text-decoration:none}
.lg b{color:var(--ol)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);display:flex;align-items:center;justify-content:center}
.w{max-width:980px;margin:0 auto;padding:12px 16px 150px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.08;margin:0 0 10px}
h2{font-size:26px;margin:0 0 6px}
.m{color:var(--mu);margin:0}
.sm{font-size:13px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px}
.cta{min-height:52px;padding:0 24px;border:0;border-radius:26px;background:var(--ac);color:var(--ot);font-weight:700;font-size:17px}
.ch{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--bd);background:transparent}
.ch[aria-pressed="true"]{background:var(--ac);color:var(--ot);border-color:var(--ac);font-weight:700}
.in{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);padding:0 14px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu);margin-bottom:12px}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--cd);border:2px solid var(--bd);min-height:120px}
.opt.p{border-color:var(--ol)}
.opt b{display:block;font-size:22px}
.tabs{display:flex;background:var(--tr);border-radius:26px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:22px;background:transparent}
.tabs button[aria-pressed="true"]{background:var(--ac);color:var(--ot);font-weight:700}
.bn{background:var(--rb);border:1px solid var(--rd);color:var(--rt);border-radius:14px;padding:14px;display:flex;gap:12px}
ol.st{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.st li{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--ot);font-weight:700;display:flex;align-items:center;justify-content:center}
.bd{display:inline-block;padding:3px 12px;border:1px solid var(--ol);color:var(--ol);border-radius:14px;font-size:13px}
.big{font-size:clamp(90px,22vw,140px);font-weight:700;color:var(--ol);line-height:1}
.mp{position:relative}
.mp svg{width:100%;height:auto;display:block;border-radius:18px}
.lb{position:absolute;right:12px;bottom:12px}
.pl{animation:pl 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{from{opacity:.7;transform:scale(.6)}to{opacity:0;transform:scale(2.2)}}
.bat{width:240px;height:88px;border:4px solid var(--ol);border-radius:22px;padding:6px;position:relative;margin:0 auto}
.bat::after{content:"";position:absolute;right:-14px;top:26px;width:10px;height:28px;border-radius:4px;background:var(--ol)}
.bat i{display:block;height:100%;border-radius:12px;background:var(--ac);animation:fl 2.2s ease-out forwards}
@keyframes fl{from{width:0}to{width:100%}}
.seg{display:flex;gap:8px;margin:18px auto;width:260px;border:3px solid var(--ol);border-radius:14px;padding:6px}
.seg i{flex:1;height:36px;border-radius:6px;background:var(--tr)}
.seg i.on{background:var(--ac)}
.tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:4px;padding:6px;background:var(--cd);border:1px solid var(--bd);border-radius:30px;max-width:calc(100vw - 24px)}
.tb button{min-height:48px;padding:0 16px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;gap:6px;font-size:15px}
.tb button[aria-current="page"]{background:var(--ac);color:var(--ot);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:11;width:64px;height:64px;border-radius:50%;border:0;background:var(--ac);box-shadow:0 0 0 6px rgba(198,244,50,.35);display:flex;align-items:center;justify-content:center}
.chat{position:fixed;right:16px;bottom:calc(162px + env(safe-area-inset-bottom,0px));z-index:12;width:min(360px,calc(100vw - 32px));max-height:min(520px,65vh);background:var(--cd);border:1px solid var(--bd);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.chat[hidden]{display:none}
#ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bw{max-width:85%;background:var(--tr);border-radius:16px 16px 16px 4px;padding:10px 12px;align-self:flex-start}
.bu{max-width:85%;background:var(--ac);color:var(--ot);border-radius:16px 16px 4px 16px;padding:10px 12px;align-self:flex-end;font-weight:500}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
@media(prefers-reduced-motion:reduce){.bat i{animation:none;width:100%}.pl{animation:none}}
</style>
</head>
<body>
<header class="hd"><a class="lg" href="#home" id="logo"></a><button class="ib" data-a="theme" id="thb" aria-label="Switch between light and dark mode"></button></header>
<main class="w" id="app"></main>
<nav class="tb" id="nav" aria-label="Main" hidden></nav>
<button class="fab" data-a="fab" aria-label="Chat with Watty" id="fab"></button>
<section class="chat" id="chat" role="dialog" aria-label="Chat with Watty" hidden>
<div class="row" style="padding:12px;border-bottom:1px solid var(--bd)"><div style="width:44px;height:44px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center" id="cav"></div><div style="flex:1"><b>Watty</b><div class="m sm">Battery and recycling helper · Gemini</div></div><button class="ib" data-a="fab" aria-label="Close chat">&#10005;</button></div>
<div id="ms" aria-live="polite"></div>
<div class="sw" style="margin:0;padding:0 12px 8px"><button class="ch sm" data-a="q" data-q="Where do I take a battery?">Where to drop off?</button><button class="ch sm" data-a="q" data-q="My battery is swollen">Swollen battery</button></div>
<form id="cf" class="row" style="padding:0 12px 12px"><input class="in" id="ci" placeholder="Ask Watty…" aria-label="Message Watty"><button class="cta" style="padding:0 16px" aria-label="Send">Send</button></form>
<div class="m sm" style="padding:0 12px 10px">Watty AI Assistant &bull; Battery safety guidance</div>
</section>
<input type="file" id="fi" accept="image/*" capture="environment" hidden>
<script>
const $=s=>document.querySelector(s),ST='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
let S={user:null,acc:[],count:0,hist:[],saved:[],theme:'auto'},M={tab:'create',cur:null,n:0,load:false,err:'',img:'',chat:[{b:1,t:'Hi, I’m Watty. Ask me about batteries, safety, or where to take them.'}],F:{f:'all',open:false,u:null,sel:null,msg:''}};
try{Object.assign(S,JSON.parse(localStorage.getItem('w2d')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('w2d',JSON.stringify(S))}catch(e){}};
const MS=z=>`<svg width="${z}" height="${z}" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="15" y="2" width="10" height="5" rx="2" fill="#0E1410"/><rect x="7" y="6" width="26" height="32" rx="9" fill="#0E1410"/><circle cx="15.5" cy="20" r="3" fill="#C6F432"/><circle cx="24.5" cy="20" r="3" fill="#C6F432"/><path d="M14 27Q20 33 26 27" stroke="#C6F432" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const BAT=w=>`<svg width="${w}" height="${w*.56}" viewBox="0 0 64 36" fill="none" aria-hidden="true"><rect x="2" y="2" width="54" height="32" rx="8" stroke="var(--ol)" stroke-width="4"/><rect x="59" y="12" width="5" height="12" rx="2" fill="var(--ol)"/><polygon points="33,6 21,20 29,20 25,30 38,15 30,15" fill="var(--ol)"/></svg>`;
const IC={cam:`<svg width="44" height="44" viewBox="0 0 24 24" ${ST}><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`,pin:`<svg width="44" height="44" viewBox="0 0 24 24" ${ST}><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,gps:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>`,home:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M4 11l8-7 8 7v9H4z"/></svg>`,bolt:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>`,usr:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,sun:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>`,moon:`<svg width="22" height="22" viewBox="0 0 24 24" ${ST}><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg>`,star:`<svg width="20" height="20" viewBox="0 0 24 24" ${ST}><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/></svg>`};
const R=[{item:'AA battery',cat:'battery',type:'Alkaline',dam:'',conf:.95,f:'batteries',st:['Tape the terminals if you are storing several.','Keep it out of household trash and curbside recycling.','Take it to a battery drop-off point.']},
{item:'Phone battery',cat:'battery',type:'Lithium-ion',dam:'Swollen cell: fire risk. Keep it away from heat.',conf:.9,f:'batteries',st:['Tape over the terminals.','Store it in a non-flammable container, away from heat and flammable items.','Never put it in household trash.','Take it to a drop-off point soon.']},
{item:'Coin',cat:'other',type:'',dam:'',conf:.9,f:'none',st:['This is not a battery.','It can go in the regular bin.']},
{item:'Unclear item',cat:'unknown',type:'',dam:'',conf:.4,f:'none',st:[]}];
let D=[[28.0587,-82.4139,['batteries','ewaste'],1],[28.0711,-82.4302,['batteries','hazardous'],1],[28.0436,-82.3991,['ewaste'],0],[28.0902,-82.4545,['batteries','ewaste','hazardous'],1],[28.0214,-82.4417,['hazardous'],0],[28.0793,-82.3724,['batteries'],1],[28.0522,-82.4798,['ewaste','batteries'],0]].map((d,i)=>({id:'s'+i,name:'Sample drop-off '+(i+1),lat:d[0],lng:d[1],acc:d[2],open:!!d[3]}));
const hv=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const eff=()=>S.theme!=='auto'?S.theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);$('#thb').innerHTML=eff()==='dark'?IC.sun:IC.moon}
const V={
welcome(){const c=M.tab==='create';return `<div class="g" style="align-items:center"><div><h1>Watt’s Next? <span style="color:var(--ol)">Watt2Do.</span></h1><p class="m">Scan a dead battery, learn how to handle it safely, and find where to drop it off. Lithium batteries in the trash start fires in garbage trucks and recycling plants.</p><div class="sw"><span class="bd">Scan it</span><span class="bd">Find a drop-off</span><span class="bd">Track your impact</span></div></div>
<div class="cd"><div class="tabs"><button data-a="tab" data-v="create" aria-pressed="${c}">Create account</button><button data-a="tab" data-v="in" aria-pressed="${!c}">Sign in</button></div>
<form id="af">${c?'<label>Name<input class="in" name="n" required placeholder="Your name"></label>':''}<label>Email<input class="in" name="e" type="email" required placeholder="you@example.com"></label><label>Password<input class="in" name="p" type="password" required minlength="8" placeholder="At least 8 characters"></label>${M.err?`<p class="bn" role="alert">${M.err}</p>`:''}<button class="cta" style="width:100%">${c?'Create account':'Sign in'}</button></form>
<p class="m sm" style="text-align:center;margin:12px 0 4px">Demo accounts are saved only in this browser.</p><button class="ch" style="width:100%" data-a="guest">Continue as guest</button></div></div>`},
home(){const h=S.hist.slice(0,3);return `<h1>Hi, ${esc(S.user.name)}</h1><p class="m">What do you want to do?</p><div class="g"><button class="opt p" data-a="scan">${IC.cam}<span><b style="color:var(--ol)">Scan an item</b><span class="m">Identify it and get safe disposal steps.</span></span></button><button class="opt" data-a="go" data-v="find">${IC.pin}<span><b>Find drop-off points</b><span class="m">Just see where to take it near you.</span></span></button></div>
<div class="cd" style="margin-top:14px"><b>${S.count}</b> items kept out of landfill</div><h2 style="margin-top:22px;font-size:20px">Recent scans</h2>${h.length?h.map(x=>`<div class="cd" style="margin-bottom:10px"><b>${x.item}</b><div class="m sm">${x.type||'Not a battery'} · ${x.d}</div></div>`).join(''):'<p class="m">No scans yet. Try your first one.</p>'}`},
load(){return `<div style="text-align:center;padding-top:40px"><h2>Analyzing your item…</h2><p class="m">Checking what it is, battery type and damage with Gemini Vision.</p>${M.img?`<img src="${M.img}" alt="Your photo" style="max-width:200px;max-height:160px;border-radius:14px;margin:18px auto;display:block" onerror="this.remove()">`:''}<div class="bat" style="margin-top:28px"><i></i></div></div>`},
result(){const r=M.cur;if(!r)return V.home();if(r.conf<.6)return `<div class="cd" style="text-align:center;margin-top:30px"><h2>Not sure, try a closer photo</h2><p class="m">The photo was unclear, so I won’t guess.</p><div class="sw" style="justify-content:center"><button class="cta" data-a="scan">Retake photo</button><button class="ch" data-a="go" data-v="home">Back</button></div></div>`;
return `<span class="bd sm">Scan result</span><div class="row" style="margin:14px 0"><svg width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="${Math.round(r.conf*100)} percent match"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--tr)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ol)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${r.conf*251} 251" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${Math.round(r.conf*100)}%</text></svg><div><h2 style="margin:0">${r.item}</h2>${r.type?`<span class="bd">${r.type}</span>`:''}</div></div>
${r.dam?`<div class="bn" role="alert"><b>Damaged battery.</b> ${r.dam}</div>`:''}<h2 style="font-size:20px;margin:18px 0 10px">What to do</h2><ol class="st">${r.st.map((s,i)=>`<li><span class="n">${i+1}</span>${s}</li>`).join('')}</ol>
<div class="sw">${r.f!=='none'?`<button class="cta" data-a="find" data-v="${r.f}">Find drop-off near me</button>`:'<p class="m">This can go in the regular bin.</p>'}<button class="ch" data-a="scan">Scan another</button></div>`},
find(){const F=M.F,c=F.u||{lat:28.06,lng:-82.41};let L=D.filter(d=>(F.f==='all'||d.acc.includes(F.f))&&(!F.open||d.open)).map(d=>({...d,km:hv(c.lat,c.lng,d.lat,d.lng)})).sort((a,b)=>a.km-b.km).slice(0,10);
const mx=Math.max(1,...L.map(d=>d.km)),k=110/mx,P=d=>[200+(d.lng-c.lng)*Math.cos(c.lat*Math.PI/180)*111*k,130-(d.lat-c.lat)*111*k];
const pins=L.map((d,i)=>{const[x,y]=P(d),s=F.sel===d.id;return `<circle cx="${x}" cy="${y}" r="${s?17:13}" fill="var(--ac)" stroke="var(--ol)" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1410">${i+1}</text>`}).join('');
return `<h2>Nearby drop-offs</h2><div class="cd row" style="margin:8px 0 12px">${IC.gps}<span style="flex:1">${F.u?'GPS on: using your location':'Showing the Tampa (USF) area'}</span><button class="ch sm" data-a="locate">${F.u?'Update':'Use my location'}</button></div>${F.msg?`<p class="m sm" role="status">${F.msg}</p>`:''}
<div class="sw" style="margin:0 0 12px"><button class="ch" data-a="open" aria-pressed="${F.open}">Open now</button>${[['all','All'],['batteries','Batteries'],['ewaste','E-waste'],['hazardous','Hazardous']].map(a=>`<button class="ch" data-a="flt" data-v="${a[0]}" aria-pressed="${F.f===a[0]}">${a[1]}</button>`).join('')}</div>
<div class="mp"><svg viewBox="0 0 400 260" role="img" aria-label="Schematic map with numbered drop-off pins"><rect width="400" height="260" rx="18" fill="var(--cd)" stroke="var(--bd)"/><path d="M0 70H400M0 190H400M110 0V260M290 0V260" stroke="var(--tr)" stroke-width="2"/><path d="M0 220L150 120L400 190" stroke="var(--bd)" stroke-width="6" fill="none"/>${pins}<circle class="pl" cx="200" cy="130" r="14" fill="#3B82F6"/><circle cx="200" cy="130" r="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/></svg><button class="ib lb" data-a="locate" aria-label="Use my location">${IC.gps}</button></div>
<p class="m sm" style="margin:6px 0 12px">Local drop-offs around USF & Hillsborough County.</p>
${L.length?L.map((d,i)=>`<div class="cd row" style="margin-bottom:10px;${F.sel===d.id?'border-color:var(--ol)':''}"><span class="n">${i+1}</span><button data-a="sel" data-v="${d.id}" style="flex:1;text-align:left;background:none;border:0;padding:4px 0"><b>${d.name}</b><div class="m sm">${d.km.toFixed(1)} km · ${d.open?'Open now':'Closed'} · ${d.acc.join(', ')}${d.address?`<br>${d.address}`:''}${d.hours?`<br>${d.hours}`:''}</div></button><button class="ib" data-a="save" data-v="${d.id}" aria-pressed="${S.saved.includes(d.id)}" aria-label="Save ${d.name}" style="${S.saved.includes(d.id)?'background:var(--ac);color:var(--ot)':''}">${IC.star}</button></div>`).join(''):'<p class="m">No drop-offs match. Try another filter.</p>'}`},
impact(){const c=S.count,l=Math.floor(c/5)+1,f=c%5;return `<div style="text-align:center;padding-top:10px"><h2>Your impact</h2><div class="big">${c}</div><p>items kept out of landfill</p><div class="seg" role="img" aria-label="Level progress">${[0,1,2,3,4].map(i=>`<i class="${i<f?'on':''}"></i>`).join('')}</div><p class="m">Level ${l} · ${5-f} more scans to Level ${l+1}</p><div class="sw" style="justify-content:center">${[[1,'First scan'],[5,'5 items'],[10,'10 items']].map(b=>`<span class="cd sm" style="${c>=b[0]?'border-color:var(--ol);font-weight:700':'opacity:.5'}">${b[1]}</span>`).join('')}</div><div style="margin-top:22px"><button class="cta" data-a="scan">Scan another item</button></div></div>`},
profile(){const u=S.user,t=['auto','light','dark'];return `<div style="text-align:center"><div style="width:92px;height:92px;border-radius:50%;border:3px solid var(--ol);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:var(--ol)"><svg width="46" height="46" viewBox="0 0 24 24" ${ST}><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div><h2 style="margin:0">${esc(u.name)}</h2><p class="m">${u.guest?'Guest mode':esc(u.email)}</p></div>
<div class="g"><div class="cd"><b style="font-size:34px;color:var(--ol)">${S.count}</b><div class="m sm">items kept out of landfill</div></div><div class="cd"><b style="font-size:34px;color:var(--ol)">Lv ${Math.floor(S.count/5)+1}</b><div class="m sm">${5-S.count%5} more scans to next level</div></div></div>
<h2 style="font-size:20px;margin:20px 0 8px">Appearance</h2><div class="tabs" role="group" aria-label="Theme">${t.map(x=>`<button data-a="th" data-v="${x}" aria-pressed="${S.theme===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
<h2 style="font-size:20px;margin:20px 0 8px">Scan history</h2>${S.hist.length?S.hist.map(x=>`<div class="cd" style="margin-bottom:8px">${x.item} <span class="m sm">· ${x.d}</span></div>`).join(''):'<p class="m">Nothing yet.</p>'}
<h2 style="font-size:20px;margin:20px 0 8px">Saved drop-off points</h2>${S.saved.length?S.saved.map(id=>`<div class="cd" style="margin-bottom:8px">${(D.find(d=>d.id===id)||{}).name}</div>`).join(''):'<p class="m">Tap the star on a drop-off to save it.</p>'}
<div class="sw">${u.guest?'<button class="cta" data-a="out">Create an account</button>':'<button class="ch" data-a="out">Sign out</button>'}<button class="ch" data-a="clear">Clear my data</button></div>`}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){let v=location.hash.slice(1);if(!S.user)v='welcome';else if(!V[v]||v==='welcome'||v==='load')v='home';const x=M.load?'load':v;$('#app').innerHTML=V[x]();
const n=$('#nav');n.hidden=!S.user;n.innerHTML=[['home','Home',IC.home],['find','Find',IC.pin.replace(/44/g,'20')],['impact','Impact',IC.bolt],['profile','Profile',IC.usr]].map(a=>`<button data-a="go" data-v="${a[0]}" ${v===a[0]?'aria-current="page"':''}>${a[2]}<span>${a[1]}</span></button>`).join('');theme()}
function go(v){if(location.hash==='#'+v)render();else location.hash=v}

async function scan(f){
  if(!f)return;
  M.img='';
  try{M.img=URL.createObjectURL(f)}catch(e){}
  M.load=true;
  render();
  let r=null;
  try{
    const fd=new FormData();
    fd.append('image',f);
    const res=await fetch('/api/scan',{method:'POST',body:fd});
    if(res.ok){
      const data=await res.json();
      if(data.ok){
        r={
          item:data.item||'Battery',
          cat:data.category||'battery',
          type:data.batteryType?data.batteryType.replace(/_/g,'-'):'',
          dam:data.damaged?(data.damageNotes||'Damaged / swollen cell: fire risk. Keep away from heat.'):'',
          conf:typeof data.confidence==='number'?data.confidence:0.95,
          f:data.dropoffFilter||'batteries',
          st:Array.isArray(data.instructions)&&data.instructions.length?data.instructions:['Tape over the terminals.','Store in a non-flammable container.','Take to a certified drop-off.']
        };
      }
    }
  }catch(e){}
  if(!r){
    await new Promise(res=>setTimeout(res,1800));
    r=R[M.n++%R.length];
  }
  M.cur=r;
  M.load=false;
  if(r.conf>=.6&&r.cat!=='other'){
    S.count++;
    S.hist.unshift({item:r.item,type:r.type,d:new Date().toLocaleDateString()});
    S.hist=S.hist.slice(0,20);
    sv();
  }
  go('result');
  render();
}

function reply(q){q=q.toLowerCase();const has=(...w)=>w.some(x=>q.includes(x));
if(has('swollen','puffy','bulg'))return['A swollen lithium battery is a fire risk. Tape the terminals, keep it away from heat and flammable items, use a non-flammable container, and take it to a drop-off point soon.',1];
if(has('trash','bin','garbage','throw'))return['Batteries should not go in household trash or curbside recycling. They can spark fires in garbage trucks and recycling plants.',1];
if(has('where','drop','near','location','take'))return['I can show drop-off points near you.',1];
if(has('tape','terminal'))return['Taping the terminals stops them touching metal and shorting. It matters most for lithium and 9V batteries.'];
if(has('lithium','phone','vape'))return['Lithium-ion batteries need extra care: tape the terminals, keep them cool, and never put them in the trash.',1];
if(has('coin','button'))return['Coin and button cells are lithium too. Tape them and take them to a drop-off point. Keep them away from children.',1];
if(has('level','impact','count'))return['Each battery you keep out of landfill adds to your count. Every 5 scans is a new level.'];
if(has('hi','hello','hey'))return['Hi! Ask me about battery safety or where to drop one off.'];
return['I can help with battery safety, disposal, and finding drop-off points. Try “Where do I take a battery?”']}
function say(q){if(!q.trim())return;M.chat.push({t:q});const r=reply(q);M.chat.push({b:1,t:r[0],a:r[1]});cr()}
function cr(){const m=$('#ms');m.innerHTML=M.chat.map(x=>`<div class="${x.b?'bw':'bu'}">${esc(x.t)}${x.a?'<div class="sw" style="margin-top:8px"><button class="ch sm" data-a="chatfind">Show drop-off points</button></div>':''}</div>`).join('');m.scrollTop=m.scrollHeight}

async function locate(){
  const F=M.F;
  if(!navigator.geolocation){
    F.msg='GPS isn’t available here, so I’m showing the Tampa area.';
    render();
    fetchBackendDropoffs(28.06,-82.41);
    return;
  }
  F.msg='Finding your location…';
  render();
  navigator.geolocation.getCurrentPosition(async p=>{
    F.u={lat:p.coords.latitude,lng:p.coords.longitude};
    F.msg='';
    render();
    await fetchBackendDropoffs(p.coords.latitude,p.coords.longitude);
  },async ()=>{
    F.u=null;
    F.msg='Couldn’t get your location, so I’m showing the Tampa area.';
    render();
    await fetchBackendDropoffs(28.06,-82.41);
  },{timeout:8000});
}

async function fetchBackendDropoffs(lat,lng){
  try{
    const filter=M.F.f==='all'?'batteries':M.F.f;
    const res=await fetch(`/api/dropoffs?lat=${lat}&lng=${lng}&filter=${filter}`);
    if(res.ok){
      const data=await res.json();
      if(data.ok&&Array.isArray(data.results)&&data.results.length){
        D=data.results.map((x,i)=>({
          id:x.id||'s'+i,
          name:x.name||('Drop-off '+(i+1)),
          lat:x.lat,
          lng:x.lng,
          acc:x.accepts||['batteries'],
          open:x.openNow!==false,
          address:x.address||'',
          hours:x.hours||''
        }));
        render();
      }
    }
  }catch(e){}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,F=M.F;
if(a==='tab'){M.tab=v;M.err='';render()}
else if(a==='guest'){S.user={name:'Guest',guest:1};sv();go('home')}
else if(a==='scan')$('#fi').click();
else if(a==='go')go(v);
else if(a==='find'){F.f=v;go('find');fetchBackendDropoffs(F.u?F.u.lat:28.06,F.u?F.u.lng:-82.41)}
else if(a==='theme'){S.theme=eff()==='dark'?'light':'dark';sv();render()}
else if(a==='th'){S.theme=v;sv();render()}
else if(a==='locate')locate();
else if(a==='open'){F.open=!F.open;render()}
else if(a==='flt'){F.f=v;render();fetchBackendDropoffs(F.u?F.u.lat:28.06,F.u?F.u.lng:-82.41)}
else if(a==='sel'){F.sel=F.sel===v?null:v;render()}
else if(a==='save'){const i=S.saved.indexOf(v);i<0?S.saved.push(v):S.saved.splice(i,1);sv();render()}
else if(a==='out'){S.user=null;M.tab=a==='out'?'create':'in';sv();go('welcome');render()}
else if(a==='clear'){S={user:S.user,acc:S.acc,count:0,hist:[],saved:[],theme:S.theme};sv();render()}
else if(a==='fab'){const c=$('#chat');c.hidden=!c.hidden;if(!c.hidden){cr();$('#ci').focus()}}
else if(a==='q')say(b.dataset.q);
else if(a==='chatfind'){$('#chat').hidden=true;go('find')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='cf'){const i=$('#ci');say(i.value);i.value='';return}
if(e.target.id==='af'){const f=new FormData(e.target),em=f.get('e').trim().toLowerCase(),pw=btoa(f.get('p'));M.err='';
if(M.tab==='create'){if(S.acc.some(x=>x.e===em)){M.err='That email already has an account. Try Sign in.';render();return}const n=f.get('n').trim();S.acc.push({e:em,n,p:pw});S.user={name:n,email:em}}
else{const a=S.acc.find(x=>x.e===em&&x.p===pw);if(!a){M.err='No account matches that email and password.';render();return}S.user={name:a.n,email:em}}
sv();go('home');render()}});
$('#fi').addEventListener('change',e=>{scan(e.target.files[0]);e.target.value=''});
addEventListener('hashchange',render);
$('#logo').innerHTML=BAT(30)+'<span>Watt<b>2</b>Do</span>';$('#fab').innerHTML=MS(38);$('#cav').innerHTML=MS(32);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
render();
</script>
